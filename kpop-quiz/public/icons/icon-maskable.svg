<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Android "maskable" icon: the launcher crops it to a circle, squircle or square, so the picture
       stays inside the middle 80% and there is no text. The normal icon (icon.svg) keeps the name. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(1.1) translate(-256 -271)">
    <rect x="86" y="176" width="340" height="190" rx="95" fill="#fff"/>
    <rect x="146" y="246" width="80" height="26" rx="8" fill="#7c3aed"/>
    <rect x="173" y="219" width="26" height="80" rx="8" fill="#7c3aed"/>
    <circle cx="330" cy="236" r="20" fill="#f59e0b"/>
    <circle cx="370" cy="276" r="20" fill="#22c55e"/>
    <circle cx="290" cy="276" r="20" fill="#3b82f6"/>
    <circle cx="330" cy="316" r="20" fill="#ef4444"/>
  </g>
</svg>
